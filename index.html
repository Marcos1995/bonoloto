<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0b3d2e">
  <title>Lotto Optimizer V3 — Bonoloto</title>
  <script src="https://cdn.jsdelivr.net/pyodide/v0.27.7/full/pyodide.js"></script>
  <style>
    :root {
      --bg: #071a14; --card: #0e2f24; --ink: #e8f5ef; --muted: #8fb3a4;
      --gold: #e8c547; --accent: #2ecc71; --danger: #e74c3c;
      --pad: max(1rem, env(safe-area-inset-left));
    }
    * { box-sizing: border-box; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      margin: 0; font-family: system-ui, Segoe UI, sans-serif;
      background: radial-gradient(1200px 600px at 50% -10%, #145c43, var(--bg));
      color: var(--ink); min-height: 100dvh;
      padding: 1rem var(--pad) 2.5rem; line-height: 1.4;
    }
    h1 { font-size: 1.35rem; margin: 0 0 .25rem; }
    .sub { color: var(--muted); font-size: .9rem; margin: 0 0 1rem; }
    .card {
      background: var(--card); border: 1px solid #1f5a44;
      border-radius: 14px; padding: 1rem; margin-bottom: 1rem;
    }
    .grid { display: grid; grid-template-columns: 1fr 1fr; gap: .7rem; }
    label { display: block; font-size: .75rem; color: var(--muted); margin-bottom: .2rem; }
    input, select, button, textarea { font: inherit; font-size: 16px; width: 100%; }
    input, select {
      background: #08241b; color: var(--ink); border: 1px solid #2a6b52;
      border-radius: 10px; padding: .65rem .7rem;
    }
    .actions { display: flex; gap: .6rem; margin-top: .9rem; }
    button {
      border: 0; border-radius: 12px; padding: .85rem 1rem;
      font-weight: 700; min-height: 48px;
    }
    .go { background: var(--gold); color: #1a1403; }
    .go:disabled { opacity: .55; }
    .metrics {
      display: grid; grid-template-columns: repeat(3, 1fr);
      gap: .5rem; text-align: center;
    }
    .metrics b { display: block; font-size: 1.15rem; color: var(--gold); }
    .metrics span { font-size: .72rem; color: var(--muted); }
    .balls { display: flex; flex-wrap: wrap; gap: .35rem; margin: .35rem 0 .7rem; }
    .ball {
      width: 2.15rem; height: 2.15rem; border-radius: 50%;
      display: grid; place-items: center;
      background: radial-gradient(circle at 30% 30%, #fff6c4, var(--gold));
      color: #1a1403; font-weight: 800; font-size: .85rem;
    }
    .row { font-size: .78rem; color: var(--muted); }
    textarea {
      min-height: 8rem; background: #08241b; color: var(--ink);
      border: 1px solid #2a6b52; border-radius: 10px; padding: .7rem; resize: vertical;
    }
    .hint { color: var(--muted); font-size: .8rem; }
    a { color: var(--gold); }
    .ok { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <h1>Lotto Optimizer V3</h1>
    <p class="sub">Web que carga y ejecuta <code>JamCat61.py</code> en el navegador (Pyodide).</p>
  </header>

  <form class="card" onsubmit="return false">
    <div class="grid">
      <div><label for="v">v (números)</label><input id="v" type="number" min="2" max="49" value="49"></div>
      <div><label for="k">k (por apuesta)</label><input id="k" type="number" min="1" max="20" value="6"></div>
      <div><label for="t">t (garantía)</label><input id="t" type="number" min="1" max="10" value="3"></div>
      <div><label for="m">m (sorteo)</label><input id="m" type="number" min="1" max="20" value="6"></div>
      <div><label for="nBets">Apuestas</label><input id="nBets" type="number" min="1" max="80" value="20"></div>
      <div><label for="secs">Segundos</label><input id="secs" type="number" min="2" max="20" value="6"></div>
      <div>
        <label for="uni">Sorteos simulados</label>
        <select id="uni">
          <option value="800" selected>800 (móvil)</option>
          <option value="2000">2000</option>
          <option value="5000">5000</option>
        </select>
      </div>
      <div>
        <label for="vel">Velocidad</label>
        <select id="vel">
          <option value="TURBO">TURBO</option>
          <option value="RAPIDA">RAPIDA</option>
          <option value="MEDIA" selected>MEDIA</option>
          <option value="LENTA">LENTA</option>
        </select>
      </div>
    </div>
    <div class="actions">
      <button class="go" id="btnGo" type="button">Optimizar con Python</button>
    </div>
    <p class="hint" id="record"></p>
  </form>

  <section class="card">
    <div class="metrics">
      <div><b id="mCob">—</b><span>Cobertura</span></div>
      <div><b id="mBets">—</b><span>Apuestas</span></div>
      <div><b id="mCic">—</b><span>Ciclos</span></div>
    </div>
    <p class="hint" id="status">Cargando el intérprete Python…</p>
    <div id="preview"></div>
    <textarea id="out" readonly placeholder="Las apuestas saldrán de JamCat61.py"></textarea>
    <div class="actions">
      <button class="go" id="btnCopy" type="button">Copiar</button>
    </div>
  </section>

  <p class="hint">Repo: <a href="https://github.com/Marcos1995/bonoloto">https://github.com/Marcos1995/bonoloto</a></p>

  <script>
    const RECORDS = {
      "49-6-3-6": 163, "49-6-4-6": 1184, "49-6-5-6": 11333,
      "49-6-3-5": 101, "49-6-4-5": 709, "49-6-3-4": 63, "49-6-4-4": 431, "49-6-3-3": 36
    };
    const VELS = new Set(["TURBO", "RAPIDA", "MEDIA", "LENTA", "ULTRA"]);
    const $ = (id) => document.getElementById(id);
    let pyodide = null;
    let ready = false;

    function params() {
      return {
        v: +$("v").value, k: +$("k").value, t: +$("t").value, m: +$("m").value,
        nBets: +$("nBets").value, secs: +$("secs").value, universo: +$("uni").value,
        vel: $("vel").value
      };
    }
    function updateRecord() {
      const p = params();
      const rec = RECORDS[`${p.v}-${p.k}-${p.t}-${p.m}`];
      $("record").textContent = rec
        ? `Récord Lotoideas: ${rec} apuestas.`
        : "Sin récord interno para esta combinación.";
    }
    ["v", "k", "t", "m"].forEach((id) => $(id).addEventListener("input", updateRecord));
    updateRecord();

    async function loadPyFile() {
      const urls = [
        "JamCat61.py",
        "https://raw.githubusercontent.com/Marcos1995/bonoloto/main/JamCat61.py"
      ];
      let last = null;
      for (const url of urls) {
        try {
          const r = await fetch(url);
          if (r.ok) return await r.text();
          last = new Error("HTTP " + r.status);
        } catch (e) { last = e; }
      }
      throw last || new Error("No se pudo leer JamCat61.py");
    }

    async function boot() {
      $("status").textContent = "Descargando Python (Pyodide)…";
      pyodide = await loadPyodide();
      $("status").textContent = "Cargando JamCat61.py…";
      const src = await loadPyFile();
      pyodide.FS.writeFile("JamCat61.py", src);
      await pyodide.runPythonAsync("import JamCat61");
      ready = true;
      $("status").innerHTML = '<span class="ok">Python listo.</span> Pulsa Optimizar: ejecuta el fichero .py real.';
    }
    boot().catch((e) => {
      $("status").textContent = "No se pudo arrancar Python: " + e.message;
    });

    $("btnGo").onclick = async () => {
      const p = params();
      if (!ready) {
        $("status").textContent = "Espera a que termine de cargar Python.";
        return;
      }
      if (!(p.t <= p.k && p.t <= p.m && p.k <= p.v && p.m <= p.v)) {
        $("status").textContent = "Parámetros inválidos: t ≤ k, t ≤ m, k ≤ v y m ≤ v.";
        return;
      }
      if (!VELS.has(p.vel)) return;
      $("btnGo").disabled = true;
      $("status").textContent = "Ejecutando JamCat61.py (universo + annealing)…";
      await new Promise((r) => setTimeout(r, 40));
      try {
        const json = await pyodide.runPythonAsync(`
import json
from JamCat61 import Configuracion, LottoOptimizerV3, Velocidad
cfg = Configuracion(v=${p.v}, k=${p.k}, t=${p.t}, m=${p.m}, universo_size=${p.universo})
opt = LottoOptimizerV3(cfg)
opt.aplicar_velocidad(Velocidad.${p.vel})
opt.generar_aleatorias(${p.nBets})
cob_ini = opt.cobertura
opt.optimizar(max_segundos=float(${p.secs}), interactivo=False)
apuestas = opt.apuestas_como_listas()
json.dumps({
    "cobertura": opt.cobertura,
    "delta": opt.cobertura - cob_ini,
    "apuestas": opt.num_apuestas,
    "ciclos": opt.ciclos,
    "listas": apuestas,
})
`);
        const r = JSON.parse(json);
        $("mCob").textContent = r.cobertura.toFixed(2) + "%";
        $("mBets").textContent = String(r.apuestas);
        $("mCic").textContent = Number(r.ciclos).toLocaleString("es");
        $("out").value = r.listas.map((row) => row.map((n) => String(n).padStart(2, "0")).join(" ")).join("\n");
        $("preview").innerHTML = r.listas.slice(0, 6).map((row) => {
          const balls = row.map((n) => `<span class="ball">${n}</span>`).join("");
          return `<div class="row">Apuesta</div><div class="balls">${balls}</div>`;
        }).join("");
        const d = r.delta;
        $("status").innerHTML = `<span class="ok">Listo (Python).</span> ${r.cobertura.toFixed(2)}% (${d >= 0 ? "+" : ""}${d.toFixed(2)}).`;
      } catch (e) {
        $("status").textContent = "Error en Python: " + e.message;
      }
      $("btnGo").disabled = false;
    };

    $("btnCopy").onclick = async () => {
      const txt = $("out").value;
      if (!txt) return;
      try {
        await navigator.clipboard.writeText(txt);
        $("status").textContent = "Apuestas copiadas.";
      } catch {
        $("out").select();
        document.execCommand("copy");
      }
    };
  </script>
</body>
</html>
